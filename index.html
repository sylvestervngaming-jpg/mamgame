<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="browsermode" content="application">
    <meta name="x5-page-mode" content="app">
    <link rel="manifest" href="manifest.json">
    <title>Mầm - Hành Trình Tìm Nắng</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="js/bundle.js?v=1787759308468" defer></script>
</head>
<body>
    <div id="rotate-device-prompt">
        <div class="rotate-icon">📱 ➔ 🔄</div>
        <h2>Vui lòng xoay ngang điện thoại</h2>
        <p>Để có trải nghiệm phiêu lưu tốt nhất cùng Mầm!</p>
        <button id="btn-lock-landscape" type="button">🔄 BẬT TOÀN MÀN HÌNH NGANG</button>
    </div>

    <script>
        function triggerLandscapeLock() {
            const docEl = document.documentElement;
            const requestFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFs && !document.fullscreenElement) {
                requestFs.call(docEl).catch(function() {});
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function() {});
            } else if (screen.lockOrientation) {
                screen.lockOrientation('landscape');
            } else if (screen.mozLockOrientation) {
                screen.mozLockOrientation('landscape');
            } else if (screen.msLockOrientation) {
                screen.msLockOrientation('landscape');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const promptEl = document.getElementById('rotate-device-prompt');
            const btn = document.getElementById('btn-lock-landscape');

            function checkOrientation() {
                if (!promptEl) return;
                // Kiểm tra xem có đang ở chế độ dọc không
                const isPortrait = window.innerHeight > window.innerWidth;
                const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 900 && isPortrait);
                
                if (isPortrait && isMobile) {
                    promptEl.style.display = 'flex';
                } else {
                    promptEl.style.display = 'none';
                }
            }

            // Chặn đứng hoàn toàn sự kiện chạm xuyên qua Canvas bên dưới (Ghost Click)
            ['touchstart', 'touchend', 'touchmove', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click'].forEach(function(evtName) {
                promptEl.addEventListener(evtName, function(e) {
                    e.stopPropagation();
                }, { passive: false });
            });

            if (btn) {
                btn.addEventListener('pointerdown', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    triggerLandscapeLock();
                    promptEl.style.display = 'none';
                    setTimeout(checkOrientation, 350);
                    setTimeout(checkOrientation, 800);
                });
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                });
            }

            window.addEventListener('resize', checkOrientation);
            window.addEventListener('orientationchange', checkOrientation);
            if (screen.orientation) {
                screen.orientation.addEventListener('change', checkOrientation);
            }

            // Kiểm tra ngay khi vừa nạp trang
            checkOrientation();
        });
    </script>
</body>
</html>
